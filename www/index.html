<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trad</title>

  <link rel="icon" type="image/x-icon" href="assets/logo.ico">


  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- Animate.css -->
  <link rel="stylesheet" href="assets/vendore/texllate/animate.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-light"

<!-- ================== OVAL SECTION ================== -->
<section id="Oval" class="mb-4" >
  <div class="container">
    <div class="d-flex justify-content-center align-items-center position-relative" style="height: 80vh;">

      <canvas id="canvasone" width="420" height="420"></canvas>

      <div id="TradHood">
        <div class="square">
          <span class="circle"></span>
          <span class="circle"></span>
          <span class="circle"></span>
        </div>
      </div>

    </div>

    <h5 class="text-center tlt">Ask me anything</h5>

    <div id="TextInput" class="d-flex justify-content-center mt-4">
      <input type="text" class="input-field me-2" id="chatbox" placeholder="type here ...">
      <button id="MicBtn" class="glow-on-hover"><i class="bi bi-mic"></i></button>
      <button id="ChatBtn" class="glow-on-hover"><i class="bi bi-chat-dots"></i></button>
      <button id="SettingsBtn" class="glow-on-hover"><i class="bi bi-gear"></i></button>
    </div>
  </div>
</section>

<!-- ================== SIRI WAVE SECTION ================== -->
<section id="SiriWave" class="mb-4">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
          <div class="">
            <p class="text-start text-light mb-4 siri-message" style="font-size: 28px;">Hello, I am T.R.A.D</p> 
          <div id="siri-container"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- ================== CHAT HISTORY PANEL ================== -->
<section id="ChatSection" class="chat-canvas position-fixed top-0 start-0 h-100 p-3"
         style="width:320px; display:none; z-index:999;">
  
  <h5 class="text-info mb-3">Chats</h5>
  <div id="chat-history" style="overflow-y:auto; height:90%;"></div>

</section>


<!-- ================== SCRIPTS (ORDER MATTERS) ================== -->

<!-- jQuery (ONLY ONCE) -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Lettering -->
<script src="assets/vendore/texllate/jquery.lettering.js"></script>

<!-- Textillate -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/textillate/0.4.0/jquery.textillate.min.js"></script>

<!-- Particle Script -->
<script src="script.js"></script>

<!-- Siri Wave -->
<script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>

<!-- Main Script -->
<script src="main.js"></script>

<script src="controller.js"></script>

<!-- Eel -->
<script src="/eel.js"></script>

</body>
</html>
